# n8n requires community nodes published from GitHub Actions with npm provenance (since 2026-05-01).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Inside GitHub Actions `n8n-node release` lints, builds and publishes with provenance.
      - name: Publish to npm with provenance
        run: |
          if npm view "n8n-nodes-cutpro@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "n8n-nodes-cutpro@${GITHUB_REF_NAME#v} is already on npm."
          else
            npm run release
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v version="${GITHUB_REF_NAME#v}" '/^## / { keep = index($0, "## " version " ") == 1; next } keep' CHANGELOG.md)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
